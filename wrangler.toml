#wrangler.toml
#
# ── Dashboard setup (recommended) ─────────────────────────────
#   1. Push this repo to GitHub.
#   2. Cloudflare Dashboard → Pages → Create a project → Connect to Git.
#   3. Select your repo, then set:
#        Framework preset  : None
#        Build command     : (LEAVE BLANK)
#        Build output dir  : /
#   4. Save and Deploy.
#
# ── CLI deploy (alternative) ──────────────────────────────────
#   npx wrangler pages deploy . --project-name eri-dashboard
#
# DO NOT set the build command to "npx wrangler deploy" in the
# dashboard — that is the Workers command and will always fail
# for a Pages project.

name = "4l-eri-ctu"
pages_build_output_dir = "."
compatibility_date = "2024-09-01"
